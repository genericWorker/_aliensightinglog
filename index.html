<!doctype html>
<html lang="us">
<head>
    <meta charset="utf-8">
    <title>Alien Sighting Form</title>
    <link href="jquery-ui.css" rel="stylesheet">
     <link href="alien.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <form id="alienForm">
        <header>
            <img src="images/aliens.png" width="80" height="40">
            <h1 class="ui-state-default ui-corner-all">Alien Sighting Form</h1>
        </header>

        <div class="form-grid">
            <div class="col-left">
                <h3 class="ui-state-default ui-corner-all" style="background: #00eeff">Sighting Date</h3>
                <div id="datepicker"></div>

                <h3 class="ui-state-default ui-corner-all" style="background: #00eeff">Creature Type</h3>
                <fieldset id="creatureType">
                    <label for="sponge">Sponge</label><input type="radio" name="ct" id="sponge">
                    <label for="worm">Worm</label><input type="radio" name="ct" id="worm" checked>
                    <label for="insect">Insect</label><input type="radio" name="ct" id="insect">
                    <label for="fish">Fish</label><input type="radio" name="ct" id="fish">
                </fieldset>
            </div>

            <div class="col-right">
                <h3 class="ui-state-default ui-corner-all" style="background: #00eeff">Physical Characteristics</h3>
                
                <p>Weight: <span id="w-label" class="stat-val">20 kg</span></p>
                <div id="slider"></div>

                <p>Height: <span id="h-label" class="stat-val">2 m</span></p>
                <div id="slider2"></div>

                <div class="spinner-group">
                    <div>Eyes<br><input id="spinnereyes" value="5"></div>
                    <div>Arms<br><input id="spinnerarms" value="0"></div>
                    <div>Legs<br><input id="spinnerlegs" value="5"></div>
                </div>

                <h3 class="ui-state-default ui-corner-all" style="background: #00eeff">Creature Color</h3>
                <div class="color-area">
                    <div class="sliders-container">
                        <div id="red"></div>
                        <div id="green"></div>
                        <div id="blue"></div>
                    </div>
                    <div id="swatch" class="ui-widget-content ui-corner-all"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            <button id="dialog-link" class="ui-button ui-corner-all">Submit Report</button>
        </div>
    </form>
</div>

<div id="dialog" title="Report Submitted">
    <p>Summary Data:</p>
    <div id="results"></div>
</div>

<script src="external/jquery/jquery.js"></script>
<script src="js/jquery-ui.js"></script>
<script>
$(function() {
    $("#datepicker").datepicker({ inline: true });
    $("input[type='radio']").checkboxradio({ icon: false });
    $("#spinnereyes, #spinnerarms, #spinnerlegs").spinner({ min: 0 });

    $("#slider").slider({
        range: "max", min: 1, max: 500, value: 20,
        slide: function(event, ui) { $("#w-label").text(ui.value + " kg"); }
    });
    $("#slider2").slider({
        range: "max", min: 1, max: 20, value: 2,
        slide: function(event, ui) { $("#h-label").text(ui.value + " m"); }
    });

    function refreshSwatch() {
        const r = $("#red").slider("value"),
              g = $("#green").slider("value"),
              b = $("#blue").slider("value");
        $("#swatch").css("background-color", "rgb(" + r + "," + g + "," + b + ")");
    }

    $("#red, #green, #blue").slider({
        orientation: "horizontal", range: "min", max: 255,
        slide: refreshSwatch, change: refreshSwatch
    });

    $("#red").slider("value", 255);
    $("#green").slider("value", 140);
    $("#blue").slider("value", 60);

    $("#dialog").dialog({ 
        autoOpen: false, 
        modal: true, 
        width: 450,
        buttons: {
            "Close": function() { $(this).dialog("close"); }
        }
    });

    $("#dialog-link").click(function(event) {
        event.preventDefault();
        const dateObj = $("#datepicker").datepicker("getDate");
        const siteReport = {
            date: dateObj ? $.datepicker.formatDate("yy-mm-dd", dateObj) : "None",
            type: $("#creatureType input:radio:checked").attr('id'),
            weight: $("#slider").slider("value"),
            height: $("#slider2").slider("value"),
            color: $("#swatch").css("background-color"),
            eyes: $("#spinnereyes").spinner("value"),
            arms: $("#spinnerarms").spinner("value"),
            legs: $("#spinnerlegs").spinner("value"),
        };
        $("#results").html("<pre>" + JSON.stringify(siteReport, null, 2) + "</pre>");
        $("#dialog").dialog("open");
    });
});
</script>
</body>
</html>
